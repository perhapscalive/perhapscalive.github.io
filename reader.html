<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article — P. CHEN</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- KaTeX for math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.getElementById('article-body'), {delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #333;
            line-height: 1.75;
            margin: 0;
            padding: 0;
        }
        .page-wrap {
            max-width: 820px;
            margin: 0 auto;
            padding: 60px 40px 100px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 40px;
            color: #005a9e;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: bold;
            letter-spacing: 0.3px;
        }
        .back-link:hover { text-decoration: underline; }
        #article-body h1 { font-size: 2em; color: #111; margin-top: 0; }
        #article-body h2 { font-size: 1.4em; color: #222; border-bottom: 1px solid #eee; padding-bottom: 6px; margin-top: 2em; }
        #article-body h3 { font-size: 1.15em; color: #333; margin-top: 1.8em; }
        #article-body p  { margin: 0 0 1em; }
        #article-body img { max-width: 100%; border-radius: 6px; margin: 1em 0; box-shadow: 0 4px 15px rgba(0,0,0,0.07); }
        #article-body a  { color: #005a9e; }
        #article-body code {
            background: #f4f6f8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }
        #article-body pre {
            background: #f4f6f8;
            padding: 20px;
            border-radius: 6px;
            overflow-x: auto;
            border-left: 3px solid #005a9e;
        }
        #article-body pre code { background: none; padding: 0; }
        #article-body blockquote {
            border-left: 4px solid #d0e1f9;
            margin: 0 0 1em;
            padding: 8px 20px;
            color: #555;
            background: #f8fbff;
            border-radius: 0 4px 4px 0;
        }
        #article-body table { border-collapse: collapse; width: 100%; margin-bottom: 1em; }
        #article-body th, #article-body td { border: 1px solid #e0e0e0; padding: 8px 14px; text-align: left; }
        #article-body th { background: #f4f6f8; font-weight: 600; }
        #article-body hr { border: none; border-top: 1px solid #eee; margin: 2em 0; }
        .error-msg { color: #c0392b; background: #fdf2f2; padding: 20px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="page-wrap">
        <a class="back-link" id="back-link" href="index.html">← Back to Home</a>
        <div id="article-body"><p style="color:#aaa;">Loading…</p></div>
    </div>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const file = params.get('file');
            const section = params.get('section') || '';   // e.g. #tools-docs

            // Update back link to jump back to the right section
            if (section) {
                document.getElementById('back-link').href = 'index.html' + section;
            }

            if (!file) {
                document.getElementById('article-body').innerHTML =
                    '<p class="error-msg">No file specified. Use <code>?file=path/to/article.md</code></p>';
                return;
            }

            fetch(file)
                .then(r => {
                    if (!r.ok) throw new Error('File not found: ' + file);
                    return r.text();
                })
                .then(md => {
                    document.getElementById('article-body').innerHTML = marked.parse(md);
                    // Update page title from first H1
                    const h1 = document.querySelector('#article-body h1');
                    if (h1) document.title = h1.textContent + ' — P. CHEN';
                    // Trigger KaTeX if loaded
                    if (window.renderMathInElement) {
                        renderMathInElement(document.getElementById('article-body'), {
                            delimiters: [
                                { left: '$$', right: '$$', display: true },
                                { left: '$',  right: '$',  display: false }
                            ]
                        });
                    }
                })
                .catch(err => {
                    document.getElementById('article-body').innerHTML =
                        `<p class="error-msg">${err.message}</p>`;
                });
        })();
    </script>
</body>
</html>
